project:
  type: website
  resources:
    - assets/*
    - assets/images/*
    - assets/pdfs/*
    - _extensions/quarto-ext/fontawesome/assets/css/all.css
    - _extensions/quarto-ext/fontawesome/assets/webfonts/*
  preview:
    port: 8808
    browser: false
  output-dir: docs
  render:
    - index.qmd
    - workshop/**/*.qmd
    - exercises/**/*.qmd
    - slides/**/*.qmd
    - resources/**/*.qmd

website:
  title: "KI in der Lehre: Beginner"
  site-url: https://virtuelleakademie.github.io/ki-lehre-beginner/
  # repo-url: https://github.com/virtuelleakademie/cas-hochschuldidaktik/
  # repo-actions: [edit, issue]
  favicon: /assets/robot.png
  open-graph: true
  search:
    location: navbar
    type: overlay

  reader-mode: false
  page-navigation: true
  back-to-top-navigation: true

  navbar:
    background: light
    left:
      - icon: card-list
        href: workshop/index.qmd
        text: Workshop

      - icon: file-slides
        href: slides/index.qmd
        text: Slides

      - icon: pencil
        href: exercises/index.qmd
        text: Übungen

    right:
      - icon: book
        text: "Ressourcen"
        menu:
          - text: "Reflexionsfragen"
            file: resources/reflexion/index.qmd
          # - text: "Schreiben als Sampling"
          #   file: resources/schreiben-als-sampling/index.qmd
          - text: "Prompting für Einsteiger"
            file: resources/prompting-basics/index.qmd
          - text: "Weiterführende Ressourcen"
            file: resources/weiterfuehrende-ressourcen/index.qmd

      - icon: file-earmark-text
        text: "Dokumente"
        menu:
          - text: "KI Policy der BFH"
            href: https://www.bfh.ch/dam/jcr:3b64bdc7-c5d6-4c62-8dc5-0e6a60901c70/KI-Policy_BFH_FHL7Mai25_verabschiedet-1.pdf
            target: _blank
          - text: "Abgeklärte KI-Tools (Intranet)"
            href: https://bernerfachhochschule.sharepoint.com/sites/mybfh-IT-Applikationen-de/SitePages/Abgekl%C3%A4rte-KI-Tools.aspx
            target: _blank
          - text: "Datenklassifikation (Intranet)"
            href: https://bernerfachhochschule.sharepoint.com/sites/mybfh-IT-Applikationen-de/SitePages/Datenklassifikation.aspx
            target: _blank
          - text: "Begleitdokument: KI Weiterbildung"
            href: assets/pdfs/Begleitdokument.pdf
            target: _blank
          - text: "Orientierungshilfe"
            href: assets/pdfs/Orientierungshilfe.pdf
            target: _blank


    tools:
      - icon: mortarboard-fill
        text: "BFH Weiterbildung: KI in der Lehre"
        href: https://virtuelleakademie.github.io/de/teaching/bfh-weiterbildung/
        target: _blank
      - icon: lightbulb-fill
        text: Knowledge Base
        href: https://virtuelleakademie.ch/knowledge-base/
        target: _blank

  sidebar:
    - title: "Workshop"
      style: "docked"
      search: true
      background: light
      contents:
        - text: "Übersicht"
          file: workshop/index.qmd
        - text: "Einstieg"
          file: workshop/einstieg/index.qmd
        - section: "Frage 1: Was ist KI?"
          contents:
            - text: "Präsentation"
              file: workshop/frage-1-was-ist-ki/index.qmd
        - section: "Frage 2: Wofür kann KI verwendet werden?"
          contents:
            - text: "Übung: Copilot Onboarding"
              file: exercises/copilot-einstieg/index.qmd
            - text: "Präsentation"
              file: workshop/frage-2-wozu-kann-ki/index.qmd
            - text: "Übung: Fakten-Check"
              file: exercises/fakten-check/index.qmd
        - section: "Frage 3: Wann hilft KI, wann schadet sie?"
          contents:
            - text: "Präsentation"
              file: workshop/frage-3-wozu-soll-ich/index.qmd
            - text: "Übung: Szenarien analysieren"
              file: exercises/offloading-outsourcing/index.qmd
        - text: "Abschluss"
          file: workshop/abschluss/index.qmd
        - text: "Reflexionsfragen"
          file: resources/reflexion/index.qmd

    - title: "Slides"
      style: "docked"
      search: true
      background: light
      contents:
        - slides/index.qmd
        - slides/frage-1-was-ist-ki/index.qmd
        - slides/frage-2-wozu-kann-ki/index.qmd
        - slides/frage-3-wozu-soll-ich/index.qmd

    - title: "Übungen"
      style: "docked"
      search: true
      background: light
      contents:
        - exercises/index.qmd
        - exercises/copilot-einstieg/index.qmd
        - exercises/fakten-check/index.qmd
        - exercises/offloading-outsourcing/index.qmd

page-footer:
    right:
    - icon: github
      href: https://github.com/virtuelleakademie/ki-lehre-beginner/

lang: de

bibliography: bibliography.bib

format:
  html:
    theme:
      - simplex
      - styles/custom.scss
    css:
      - styles/styles.css
      - _extensions/quarto-ext/fontawesome/assets/css/all.css
    include-after-body: scripts/copy-prompt.js
    code-copy: true
    toc: true
    link-external-icon: true
    link-external-newwindow: true
    anchor-sections: true
    smooth-scroll: true

comments:
  hypothesis:
    theme: clean
  # utterances:
  # repo: virtuelleakademie/promptly-literate

execute:
  cache: true
  freeze: auto
  execute-dir: project

editor:
  render-on-save: true

revealjs-plugins:
  - attribution
filters:
  - timer
  - custom-callout

custom-callout:
  # Activity types - what participants DO (Magenta)
  experiment:
    title: "Deine Aufgabe"
    icon-symbol: "fa-flask"
    appearance: default
    collapse: false
    color: "#A3195B"  # Deep Magenta (action)

  individual:
    title: "Einzelarbeit"
    icon-symbol: "fa-user"
    appearance: default
    color: "#A3195B"  # Deep Magenta (action)
    collapse: false

  group:
    title: "Gruppenarbeit"
    icon-symbol: "fa-users"
    appearance: default
    color: "#A3195B"  # Deep Magenta (action)
    collapse: false

  demonstration:
    title: "Demonstration"
    icon-symbol: "fa-chalkboard"
    appearance: default
    collapse: false
    color: "#333333"  # Dark grey (instructor-led, neutral)

  # Thinking types - reflection and insights (Gold)
  scenario:
    title: "Szenario"
    icon-symbol: "fa-comment"
    appearance: default
    color: "#666666"  # Medium grey (neutral context)
    collapse: false

  reflect:
    title: "Reflexion"
    icon-symbol: "fa-lightbulb"
    appearance: default
    color: "#D4A03E"  # Warm Gold (insight)
    collapse: false

  key-point:
    title: "Kernaussage"
    icon-symbol: "fa-star"
    appearance: default
    collapse: false
    color: "#D4A03E"  # Warm Gold (importance)

  # Alert type
  warning:
    title: "Achtung"
    icon-symbol: "fa-exclamation-circle"
    appearance: default
    color: "#A3195B"  # Deep Magenta (attention)
    collapse: false

  # Guidance types (Gold)
  pro-tip:
    title: "Tipp"
    icon-symbol: "fa-wand-magic-sparkles"
    appearance: default
    color: "#D4A03E"  # Warm Gold (helpful)
    collapse: true

  source-check:
    title: "Quellen-Check"
    icon-symbol: "fa-search"
    appearance: default
    color: "#D4A03E"  # Warm Gold (verification)
    collapse: false

  # Technical - copyable prompt for chatbot input
  prompt:
    title: "Prompt"
    icon-symbol: "fa-clipboard"
    appearance: default
    color: "#333333"  # Dark grey (code-like)
    collapse: false

