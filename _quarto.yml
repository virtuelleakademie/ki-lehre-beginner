project:
  type: website
  resources:
    - assets/*
    - assets/images/*
    - assets/pdfs/*
  preview:
    port: 8808
    browser: false
  output-dir: docs
  render:
    - index.qmd
    - workshop/**/*.qmd
    - exercises/**/*.qmd
    - slides/**/*.qmd
    - resources/**/*.qmd

website:
  title: "KI in der Lehre: Beginner"
  site-url: https://virtuelleakademie.github.io/ki-lehre-beginner/
  # repo-url: https://github.com/virtuelleakademie/cas-hochschuldidaktik/
  # repo-actions: [edit, issue]
  favicon: /assets/robot.png
  open-graph: true
  search:
    location: navbar
    type: overlay

  reader-mode: false
  page-navigation: true
  back-to-top-navigation: true

  navbar:
    background: light
    left:
      - icon: card-list
        href: workshop/index.qmd
        text: Workshop

      - icon: file-slides
        href: slides/index.qmd
        text: Slides

      - icon: pencil
        href: exercises/index.qmd
        text: Übungen

    right:
      - icon: briefcase
        text: "Dokumente" # {{< fa person-chalkboard >}}
        menu:
          - text: "KI Policy der BFH"
            file: https://www.bfh.ch/dam/jcr:3b64bdc7-c5d6-4c62-8dc5-0e6a60901c70/KI-Policy_BFH_FHL7Mai25_verabschiedet-1.pdf
          - text: "Begleitdokument: KI Weiterbildung"
            file: assets/pdfs/Begleitdokument.pdf
          - text: "Begleitdokument: Orientierungshilfe"
            file: resources/resources.qmd
          - text: "Begleitdokument: Orientierungshilfe (PDF)"
            file: assets/pdfs/Orientierungshilfe.pdf


    tools:
      - icon: lightbulb-fill
        text: Knowledge Base
        href: https://virtuelleakademie.ch/knowledge-base/

      # - icon: github
      #   menu:
      #     - text: Source code
      #       url:  https://github.com/virtuelleakademie/cas-hochschuldidaktik/
      #     - text: Report an issue
      #       url:  https://github.com/virtuelleakademie/cas-hochschuldidaktik/issues

  sidebar:
    - title: "Workshop"
      style: "docked"
      search: true
      background: light
      contents:
        - workshop/index.qmd
        - workshop/einstieg/index.qmd
        - slides/ki-verstehen/index.qmd
        - slides/bfh-landscape/index.qmd
        - exercises/fakten-check/index.qmd
        - exercises/offloading-outsourcing/index.qmd
        - workshop/abschluss/index.qmd

    - title: "Slides"
      style: "docked"
      search: true
      background: light
      contents:
        - slides/index.qmd
        - slides/ki-verstehen/index.qmd
        - slides/bfh-landscape/index.qmd

    - title: "Übungen"
      style: "docked"
      search: true
      background: light
      contents:
        - exercises/index.qmd
        - exercises/fakten-check/index.qmd
        - exercises/offloading-outsourcing/index.qmd

page-footer:
  right:
    - icon: github
      href: https://github.com/virtuelleakademie/ki-lehre-intermediate/

lang: de

format:
  html:
    theme:
      - simplex
      - styles/custom.scss
    css:
      - styles/styles.css
      - _extensions/quarto-ext/fontawesome/assets/css/all.css
    include-after-body: scripts/copy-prompt.js
    code-copy: true
    toc: true
    link-external-icon: true
    link-external-newwindow: true
    anchor-sections: true
    smooth-scroll: true

comments:
  hypothesis:
    theme: clean
  # utterances:
  # repo: virtuelleakademie/promptly-literate

execute:
  cache: true
  freeze: auto
  execute-dir: project

editor:
  render-on-save: true

revealjs-plugins:
  - attribution
filters:
  - timer
  - custom-callout

custom-callout:
  # Activity types - what participants DO (Magenta)
  experiment:
    title: "Deine Aufgabe"
    icon-symbol: "fa-flask"
    appearance: default
    collapse: false
    color: "#A3195B"  # Deep Magenta (action)

  individual:
    title: "Einzelarbeit"
    icon-symbol: "fa-user"
    appearance: default
    color: "#A3195B"  # Deep Magenta (action)
    collapse: false

  group:
    title: "Gruppenarbeit"
    icon-symbol: "fa-users"
    appearance: default
    color: "#A3195B"  # Deep Magenta (action)
    collapse: false

  demonstration:
    title: "Demonstration"
    icon-symbol: "fa-chalkboard"
    appearance: default
    collapse: false
    color: "#333333"  # Dark grey (instructor-led, neutral)

  # Thinking types - reflection and insights (Gold)
  scenario:
    title: "Szenario"
    icon-symbol: "fa-comment"
    appearance: default
    color: "#666666"  # Medium grey (neutral context)
    collapse: false

  reflect:
    title: "Reflexion"
    icon-symbol: "fa-lightbulb"
    appearance: default
    color: "#D4A03E"  # Warm Gold (insight)
    collapse: false

  key-point:
    title: "Kernaussage"
    icon-symbol: "fa-star"
    appearance: default
    collapse: false
    color: "#D4A03E"  # Warm Gold (importance)

  # Alert type
  warning:
    title: "Achtung"
    icon-symbol: "fa-exclamation-circle"
    appearance: default
    color: "#A3195B"  # Deep Magenta (attention)
    collapse: false

  # Guidance types (Gold)
  pro-tip:
    title: "Tipp"
    icon-symbol: "fa-wand-magic-sparkles"
    appearance: default
    color: "#D4A03E"  # Warm Gold (helpful)
    collapse: true

  source-check:
    title: "Quellen-Check"
    icon-symbol: "fa-search"
    appearance: default
    color: "#D4A03E"  # Warm Gold (verification)
    collapse: false

  # Technical - copyable prompt for chatbot input
  prompt:
    title: "Prompt"
    icon-symbol: "fa-clipboard"
    appearance: default
    color: "#333333"  # Dark grey (code-like)
    collapse: false

